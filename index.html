
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game 🐍</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.game-container {
    width: 100%;
    max-width: 430px;
    text-align: center;
    background: #202d46;
    padding: 22px;
    border-radius: 22px;
    box-shadow: 0 10px 35px #0006;
}

h1 {
    color: #7CFF6B;
    margin-bottom: 8px;
}

.subtitle {
    color: #c5d3e8;
    margin-bottom: 18px;
    font-size: 14px;
}

.score-board {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.score-box {
    background: #30415e;
    padding: 12px;
    border-radius: 12px;
    flex: 1;
}

.score-box p {
    color: #b8c8df;
    font-size: 13px;
}

.score-box h2 {
    color: #7CFF6B;
    margin-top: 5px;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #101b2d;
    border: 3px solid #7CFF6B;
    border-radius: 12px;
    margin-bottom: 15px;
    touch-action: none;
}

.message {
    min-height: 25px;
    color: #ffd166;
    font-weight: bold;
    margin-bottom: 12px;
}

button {
    border: none;
    padding: 12px 20px;
    margin: 5px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:active {
    transform: scale(0.94);
}

.start-btn {
    background: #7CFF6B;
    color: #142238;
}

.restart-btn {
    background: #ff6384;
    color: white;
}

.controls {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    justify-content: center;
    gap: 8px;
    margin: 15px auto;
}

.controls button {
    background: #405675;
    color: white;
    font-size: 22px;
    padding: 12px;
    margin: 0;
}

.controls button:hover {
    background: #607da4;
}

.instructions {
    color: #c5d3e8;
    font-size: 13px;
    line-height: 1.7;
    margin-top: 15px;
}

@media (max-width: 380px) {
    .game-container {
        padding: 13px;
    }
}
</style>
</head>

<body>

<div class="game-container">

    <h1>🐍 Snake Game</h1>
    <p class="subtitle">Eat apples, grow longer & beat your high score!</p>

    <div class="score-board">
        <div class="score-box">
            <p>YOUR SCORE</p>
            <h2 id="score">0</h2>
        </div>

        <div class="score-box">
            <p>HIGH SCORE</p>
            <h2 id="highScore">0</h2>
        </div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="message" id="message">
        Press Start to Play!
    </div>

    <button class="start-btn" onclick="startGame()">
        ▶ Start Game
    </button>

    <button class="restart-btn" onclick="restartGame()">
        ↻ Restart
    </button>

    <div class="controls">
        <div></div>
        <button onclick="changeDirection('UP')">⬆️</button>
        <div></div>

        <button onclick="changeDirection('LEFT')">⬅️</button>
        <button onclick="changeDirection('DOWN')">⬇️</button>
        <button onclick="changeDirection('RIGHT')">➡️</button>
    </div>

    <div class="instructions">
        <b>How to Play?</b><br>
        🟢 Use arrow keys or buttons to move.<br>
        🍎 Eat apples to earn 10 points.<br>
        🚫 Don't hit the wall or yourself!<br>
        🏆 Beat your highest score.
    </div>

</div>

<script>

// 1. Get HTML elements
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const highScoreElement = document.getElementById("highScore");
const message = document.getElementById("message");

// 2. Game settings
const box = 20;
const totalBoxes = canvas.width / box;

let snake;
let food;
let score = 0;

let direction = "RIGHT";
let nextDirection = "RIGHT";

let gameInterval = null;
let gameRunning = false;
let gameOver = false;

let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;

highScoreElement.textContent = highScore;

// 3. Create initial snake
function initializeGame() {

    snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
    ];

    direction = "RIGHT";
    nextDirection = "RIGHT";

    score = 0;
    scoreElement.textContent = score;

    gameOver = false;

    createFood();
    drawGame();
}

// 4. Create food randomly
function createFood() {

    do {
        food = {
            x: Math.floor(Math.random() * totalBoxes),
            y: Math.floor(Math.random() * totalBoxes)
        };
    } while (
        snake.some(part =>
            part.x === food.x && part.y === food.y
        )
    );
}

// 5. Draw snake, food and board
function drawGame() {

    ctx.fillStyle = "#101b2d";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw food
    ctx.fillStyle = "#ff6384";
    ctx.beginPath();
    ctx.arc(
        food.x * box + box / 2,
        food.y * box + box / 2,
        box / 2 - 2,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Draw snake
    snake.forEach((part, index) => {

        ctx.fillStyle = index === 0 ? "#7CFF6B" : "#36c98f";

        ctx.fillRect(
            part.x * box + 1,
            part.y * box + 1,
            box - 2,
            box - 2
        );

        // Snake eyes
        if (index === 0) {
            ctx.fillStyle = "#142238";

            ctx.fillRect(
                part.x * box + 12,
                part.y * box + 5,
                3, 3
            );

            ctx.fillRect(
                part.x * box + 12,
                part.y * box + 12,
                3, 3
            );
        }
    });
}

// 6. Main game logic
function updateGame() {

    if (!gameRunning) return;

    direction = nextDirection;

    let head = { ...snake[0] };

    if (direction === "UP") head.y--;
    if (direction === "DOWN") head.y++;
    if (direction === "LEFT") head.x--;
    if (direction === "RIGHT") head.x++;

    // Check wall collision
    if (
        head.x < 0 ||
        head.x >= totalBoxes ||
        head.y < 0 ||
        head.y >= totalBoxes
    ) {
        endGame();
        return;
    }

    // Check if snake eats food
    const ateFood =
        head.x === food.x && head.y === food.y;

    // Check snake collision
    const bodyToCheck = ateFood
        ? snake
        : snake.slice(0, -1);

    if (bodyToCheck.some(part =>
        part.x === head.x && part.y === head.y
    )) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (ateFood) {

        score += 10;
        scoreElement.textContent = score;

        // Update high score
        if (score > highScore) {
            highScore = score;
            highScoreElement.textContent = highScore;

            localStorage.setItem(
                "snakeHighScore",
                highScore
            );
        }

        createFood();

    } else {
        snake.pop();
    }

    drawGame();
}

// 7. Start game
function startGame() {

    if (gameRunning) return;

    if (gameOver) {
        initializeGame();
    }

    gameRunning = true;
    message.textContent = "🍎 Eat the apples!";

    gameInterval = setInterval(updateGame, 120);
}

// 8. Restart game
function restartGame() {

    clearInterval(gameInterval);
    gameInterval = null;

    gameRunning = false;
    gameOver = false;

    initializeGame();

    message.textContent = "Ready? Press Start!";
}

// 9. End game
function endGame() {

    clearInterval(gameInterval);
    gameInterval = null;

    gameRunning = false;
    gameOver = true;

    message.textContent =
        "💥 Game Over! Your Score: " + score;
}

// 10. Change snake direction
function changeDirection(newDirection) {

    if (!gameRunning) return;

    if (
        newDirection === "UP" && direction !== "DOWN" ||
        newDirection === "DOWN" && direction !== "UP" ||
        newDirection === "LEFT" && direction !== "RIGHT" ||
        newDirection === "RIGHT" && direction !== "LEFT"
    ) {
        nextDirection = newDirection;
    }
}

// 11. Keyboard controls
document.addEventListener("keydown", function(event) {

    const keys = {
        ArrowUp: "UP",
        ArrowDown: "DOWN",
        ArrowLeft: "LEFT",
        ArrowRight: "RIGHT"
    };

    if (keys[event.key]) {
        event.preventDefault();
        changeDirection(keys[event.key]);
    }
});

// 12. Mobile swipe controls
let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", function(event) {

    const touch = event.changedTouches[0];

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;

}, { passive: true });

canvas.addEventListener("touchend", function(event) {

    const touch = event.changedTouches[0];

    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 20) changeDirection("RIGHT");
        if (dx < -20) changeDirection("LEFT");
    } else {
        if (dy > 20) changeDirection("DOWN");
        if (dy < -20) changeDirection("UP");
    }

}, { passive: true });

// 13. Initialize game when page loads
initializeGame();

</script>

</body>
</html>
